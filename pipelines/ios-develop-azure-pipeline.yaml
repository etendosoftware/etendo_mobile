variables:
  P12SecureFileId: f5ebc007-cdc0-4c03-9e7d-a7e0c5de5efc
  MobileProvisionSecureFileId: ca1a75cd-d8c7-4b66-b43c-c1f976309e37
  AppExtensionProvisionSecureFiles: >-
    [{"fileId":"44a314c3-d9dc-4f77-8f1a-e1c90aa9cbeb","fileName":"Etendo_Recieve_Share.mobileprovision","targetBundleIdentifier":"com.etendoapploader.ios.EtendoRecieveShare"}]
  MobileProvision: >-
    {"expirationDate":"2026-12-17T13:34:03Z","teamIdentifier":"B4T44MT553","type":"app-store","bundleIdentifier":"com.etendoapploader.ios","UUID":"26b648c5-9580-43c7-8056-0fffdaf5585d"}
  APPCENTER_XCODE_PROJECT: ios/Etendo_Mobile.xcworkspace
  APPCENTER_XCODE_WORKSPACE: ios/Etendo_Mobile.xcworkspace
  sonoma.tags: 'continuous,javascript,xcode,signed,distribution'
  artifactVersioning.build.value: '0'
  # Additional required variables
  APPLE_CERTIFICATE_SIGNING_IDENTITY: 'Apple Distribution: FUTIT SERVICES SRL (B4T44MT553)'
name: $(artifactVersioning.build.value)
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/$(Build.SourceBranch)

pr: none
jobs:
  - job: Phase_1
    displayName: Build
    timeoutInMinutes: 300
    cancelTimeoutInMinutes: 0
    pool:
      name: Azure Pipelines
      vmImage: macOS-26
    steps:
      - checkout: self
        clean: true
        submodules: recursive
        lfs: true
      
      - task: Bash@3
        displayName: Verify checkout
        inputs:
          targetType: 'inline'
          script: |
            echo "Working directory: $(pwd)"
            echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
            ls -la $(Build.SourcesDirectory)/
            echo "=== yarn.lock exists? ==="
            test -f $(Build.SourcesDirectory)/yarn.lock && echo "YES" || echo "NO"
          failOnStderr: false

      - task: ShellScript@2
        displayName: Post Clone Script
        condition: succeeded()
        inputs:
          scriptPath: appcenter-post-clone.sh
      
      - task: NodeTool@0
        displayName: 'Use Node 18.x'
        inputs:
          versionSpec: '18.x'
      
      - task: Bash@3
        displayName: Select Node.js Version v2 (Alternative)
        condition: false
        inputs:
          targetType: 'inline'
          script: |
            SCRIPT_PATH="$(Agent.HomeDirectory)/scripts/select-node-version.sh"
            if [ -f "$SCRIPT_PATH" ]; then
              echo "Running select-node-version.sh..."
              bash "$SCRIPT_PATH" node18
            else
              echo "Script not found at $SCRIPT_PATH, using direct node setup..."
              if command -v nvm &> /dev/null; then
                nvm use 18 || nvm install 18
              elif command -v nodenv &> /dev/null; then
                nodenv global 18.19.0 || nodenv install 18.19.0
              else
                echo "Node.js setup completed via NodeTool task"
              fi
            fi
          failOnStderr: false
      
      - task: Cache@2
        displayName: Cache node_modules
        inputs:
          key: '"node-v2" | "$(Agent.OS)" | yarn.lock'
          restoreKeys: |
            "node-v2" | "$(Agent.OS)"
          path: $(System.DefaultWorkingDirectory)/node_modules
          cacheHitVar: YARN_CACHE_HIT

      - task: CmdLine@1
        displayName: yarn/npm install
        condition: ne(variables.YARN_CACHE_HIT, 'true')
        inputs:
          filename: sh
          arguments: >-
            -c "if [ -f yarn.lock ]; then { yarn install
            --network-timeout=600000; } else npm install; fi"
      
      - task: Bash@3
        displayName: Verify patch-package applied
        inputs:
          targetType: 'inline'
          script: |
            echo "Verifying react-native-screens patch..."
            if grep -q "ShadowTreeCommitOptions" node_modules/react-native-screens/common/cpp/react/renderer/components/rnscreens/RNSScreenShadowNodeCommitHook.cpp 2>/dev/null; then
              echo "ERROR: patch NOT applied - ShadowTreeCommitOptions still present"
              exit 1
            else
              echo "OK: ShadowTreeCommitOptions patch applied"
            fi
            if grep -q "RNSFullScreenSwipeEnabled" node_modules/react-native-screens/ios/RNSConvert.h 2>/dev/null; then
              echo "ERROR: patch NOT applied - RNSFullScreenSwipeEnabled still present in RNSConvert.h"
              exit 1
            else
              echo "OK: fullScreenSwipeEnabled patch applied"
            fi

      - task: CmdLine@2
        displayName: Generate source map
        inputs:
          script: >-
            #!/bin/sh

            INDEX_FILE="index.ios.js"

            if [ -f "index.js" ]; then
              INDEX_FILE="index.js"
            fi

            echo "Found $INDEX_FILE for ReactNative index."

            if [ ! -f ./node_modules/react-native/local-cli/cli.js ]; then
              mkdir -p ./node_modules/react-native/local-cli
             echo "require('@react-native-community/cli').run();" >> ./node_modules/react-native/local-cli/cli.js
            fi

            node --max_old_space_size=4096
            node_modules/react-native/local-cli/cli.js bundle --entry-file
            $INDEX_FILE --platform ios --dev false --reset-cache --bundle-output
            dummy-sourcemap-main.jsbundle --sourcemap-output index.ios.map
          failOnStandardError: false
      
      - task: CmdLine@1
        displayName: Copy source map file to staging
        inputs:
          filename: sh
          arguments: >-
            -c "mkdir -p $(build.artifactstagingdirectory)/symbols && cp
            index.ios.map $(build.artifactstagingdirectory)/symbols/"
          failOnStandardError: true
      
      - task: Bash@3
        displayName: Tag build (with verification)
        inputs:
          targetType: 'inline'
          script: |
            SCRIPT_PATH="$(Agent.HomeDirectory)/scripts/emit-tags.sh"
            if [ -f "$SCRIPT_PATH" ]; then
              echo "Running emit-tags.sh..."
              bash "$SCRIPT_PATH" $(sonoma.tags)
            else
              echo "emit-tags.sh not found, creating tags manually..."
              echo "##vso[build.addbuildtag]continuous"
              echo "##vso[build.addbuildtag]javascript"
              echo "##vso[build.addbuildtag]xcode"
              echo "##vso[build.addbuildtag]signed"
              echo "##vso[build.addbuildtag]distribution"
            fi
          failOnStderr: false
      
      - task: Bash@3
        displayName: "Select Xcode 26"
        inputs:
          targetType: 'inline'
          script: |
              echo "macOS version:"
              sw_vers -productVersion

              echo "=== Available Xcode installations ==="
              ls -la /Applications | grep 'Xcode' || true

              # Prefer stable Xcode 26.x, then beta, then fallback
              XCODE_CANDIDATE=$(ls /Applications | grep -E '^(Xcode_26|Xcode 26)' | grep -vi beta | sort -V | tail -n 1)
              if [ -z "$XCODE_CANDIDATE" ]; then
                echo "No stable Xcode 26 found, trying beta..."
                XCODE_CANDIDATE=$(ls /Applications | grep -E '^(Xcode_26|Xcode 26)' | sort -V | tail -n 1)
              fi
              if [ -z "$XCODE_CANDIDATE" ]; then
                echo "No Xcode 26 found, falling back to highest available version..."
                XCODE_CANDIDATE=$(ls /Applications | grep -E '^(Xcode_|Xcode )' | sort -V | tail -n 1)
              fi

              if [ -z "$XCODE_CANDIDATE" ]; then
                echo "ERROR: No compatible Xcode installation found (need Xcode 26+)."
                ls /Applications | grep 'Xcode' || true
                exit 1
              fi

              echo "Selected Xcode: $XCODE_CANDIDATE"
              XCODE_PATH="/Applications/$XCODE_CANDIDATE/Contents/Developer"
              echo "##vso[task.setvariable variable=XCODE_DEVELOPER_DIR]$XCODE_PATH"

              sudo xcode-select -s "$XCODE_PATH"

              echo "Verification:"
              xcodebuild -version
              echo "Available SDKs:"
              xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator' || true

      - task: Bash@3
        displayName: "Setup Xcode and install iOS platform"
        inputs:
          targetType: 'inline'
          script: |
              set -x
              echo "=== Accept license ==="
              sudo xcodebuild -license accept || true

              echo "=== Run first launch ==="
              sudo xcodebuild -runFirstLaunch || true

              echo "=== Download iOS platform ==="
              sudo xcodebuild -downloadPlatform iOS 2>&1
              echo "Download exit code: $?"

              echo "=== Available SDKs ==="
              xcodebuild -showsdks

              echo "=== Available destinations for scheme ==="
              xcodebuild -showdestinations \
                -workspace ios/Etendo_Mobile.xcworkspace \
                -scheme Etendo_Mobile 2>&1 || true

              echo "=== Check if Xcode is symlink ==="
              ls -la /Applications/ | grep Xcode_26 || true
              file /Applications/Xcode_26.5.0.app || true
              echo "=== Platform directories ==="
              ls -la "$(xcode-select -p)/Platforms/" || true
              ls -la "$(xcode-select -p)/Platforms/iPhoneOS.platform/" || true
              ls -la "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/" || true
          workingDirectory: '$(Build.SourcesDirectory)'
        timeoutInMinutes: 30

      - task: InstallAppleCertificate@2
        displayName: Install Apple certificate
        inputs:
          certSecureFile: $(P12SecureFileId)
          certPwd: $(P12Password)
          opensslPkcsArgs: '-legacy'
      
      - task: InstallAppleProvisioningProfile@0
        displayName: Install Apple provisioning profile
        inputs:
          provProfileSecureFile: $(MobileProvisionSecureFileId)
      
      - task: InstallAppleProvisioningProfile@0
        displayName: Install Apple provisioning profile
        inputs:
          provProfileSecureFile: 44a314c3-d9dc-4f77-8f1a-e1c90aa9cbeb
      
      - task: Bash@3
        displayName: Verify certificates and provisioning profiles
        inputs:
          targetType: 'inline'
          script: |
            security find-identity -v -p codesigning
            
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
            
            security list-keychains
            security default-keychain
            
            xcodebuild -showsdks
          failOnStderr: false
      
      - task: Bash@3
        displayName: Disable Flipper for CI
        inputs:
          targetType: 'inline'
          script: |
            echo "Disabling Flipper for CI build..."
            export NO_FLIPPER=1
            echo "##vso[task.setvariable variable=NO_FLIPPER]1"
            echo "Flipper disabled successfully"
          failOnStderr: false
      
      - task: Cache@2
        displayName: Cache CocoaPods Pods
        inputs:
          key: '"pods-v4" | "$(Agent.OS)" | ios/Podfile.lock'
          restoreKeys: |
            "pods-v4" | "$(Agent.OS)"
          path: $(System.DefaultWorkingDirectory)/ios/Pods
          cacheHitVar: PODS_CACHE_HIT

      - task: Bash@3
        displayName: Clean CocoaPods cache
        condition: ne(variables.PODS_CACHE_HIT, 'true')
        inputs:
          targetType: 'inline'
          script: |
            rm -rf Pods Podfile.lock
          workingDirectory: '$(System.DefaultWorkingDirectory)/ios'

      - task: Bash@3
        displayName: Invalidate Pods Manifest to force post_install on cache hit
        condition: eq(variables.PODS_CACHE_HIT, 'true')
        inputs:
          targetType: 'inline'
          script: |
            rm -f Pods/Manifest.lock
            echo "Cleared Manifest.lock — pod install will regenerate project and run post_install hook"
          workingDirectory: '$(System.DefaultWorkingDirectory)/ios'

      - task: Bash@3
        displayName: Pre-download Hermes engine
        inputs:
          targetType: 'inline'
          script: |
            RN_VERSION=$(node -e "console.log(require('./node_modules/react-native/package.json').version)")
            mkdir -p /tmp/hermes-cache
            if [ ! -f /tmp/hermes-cache/hermes-ios-debug.tar.gz ]; then
              HERMES_URL="https://repo1.maven.org/maven2/com/facebook/react/react-native-artifacts/${RN_VERSION}/react-native-artifacts-${RN_VERSION}-hermes-ios-debug.tar.gz"
              echo "Downloading Hermes ${RN_VERSION} from Maven Central..."
              curl -f -L --retry 5 --retry-delay 5 --retry-max-time 120 \
                -o /tmp/hermes-cache/hermes-ios-debug.tar.gz \
                "$HERMES_URL"
              echo "Hermes downloaded successfully."
            else
              echo "Hermes already present in cache, skipping download."
            fi
            echo "##vso[task.setvariable variable=HERMES_ENGINE_TARBALL_PATH]/tmp/hermes-cache/hermes-ios-debug.tar.gz"
          workingDirectory: '$(System.DefaultWorkingDirectory)'

      - task: Bash@3
        displayName: Pod install
        inputs:
          targetType: 'inline'
          script: |
            pod install --no-repo-update
          workingDirectory: '$(System.DefaultWorkingDirectory)/ios'

      - task: Bash@3
        displayName: Patch Pods deployment targets (pbxproj + xcconfig)
        inputs:
          targetType: 'inline'
          script: |
            PODS_DIR="$(System.DefaultWorkingDirectory)/ios/Pods"

            # 1. Patch Pods.xcodeproj/project.pbxproj
            PBXPROJ="$PODS_DIR/Pods.xcodeproj/project.pbxproj"
            if [ -f "$PBXPROJ" ]; then
              sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.1/g' "$PBXPROJ"
              echo "pbxproj unique values after patch:"
              grep "IPHONEOS_DEPLOYMENT_TARGET" "$PBXPROJ" | sort -u
            else
              echo "ERROR: Pods.xcodeproj not found"
              exit 1
            fi

            # 2. Patch xcconfig base configuration files — podspecs like
            #    react-native-document-picker (11.0) and VisionCamera (12.4)
            #    hardcode deployment targets here and override pbxproj settings
            XCCONFIG_COUNT=$(find "$PODS_DIR" -name "*.xcconfig" | xargs grep -l "IPHONEOS_DEPLOYMENT_TARGET" 2>/dev/null | wc -l | tr -d ' ')
            echo "Patching $XCCONFIG_COUNT xcconfig files..."
            find "$PODS_DIR" -name "*.xcconfig" \
              -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.1/g' {} \;
            echo "Done. Remaining unique deployment targets in xcconfig files:"
            find "$PODS_DIR" -name "*.xcconfig" | xargs grep "IPHONEOS_DEPLOYMENT_TARGET" 2>/dev/null | awk -F'=' '{print $2}' | sort -u

            # 3. Patch fmt source to fix consteval errors with Xcode 26+ Clang
            #    Xcode 26 Clang rejects consteval in fmt 11.0.2.
            #    Directly patch the header so the macro resolves to constexpr.
            FMT_BASE="$PODS_DIR/fmt/include/fmt/base.h"
            if [ -f "$FMT_BASE" ]; then
              echo "Patching fmt base.h to force FMT_CONSTEVAL=constexpr..."
              # Note: fmt uses "#  define" (with spaces after #) inside #ifdef blocks
              sed -i '' 's/define FMT_CONSTEVAL consteval/define FMT_CONSTEVAL constexpr/' "$FMT_BASE"
              echo "Result:"
              grep -n "FMT_CONSTEVAL" "$FMT_BASE" | head -5
            else
              echo "WARNING: $FMT_BASE not found — fmt pod may not be installed"
            fi

      - task: Bash@3
        displayName: Determine project file path (with verification)
        inputs:
          targetType: 'inline'
          script: |
            SCRIPT_PATH="$(Agent.HomeDirectory)/scripts/detect-autogenerated-workspace.sh"
            if [ -f "$SCRIPT_PATH" ]; then
              echo "Running detect-autogenerated-workspace.sh..."
              bash "$SCRIPT_PATH" ios Etendo_Mobile
            else
              echo "detect-autogenerated-workspace.sh not found, setting default workspace..."
              echo "##vso[task.setvariable variable=APPCENTER_XCODE_PROJECT]ios/Etendo_Mobile.xcworkspace"
            fi
          workingDirectory: $(Build.SourcesDirectory)
          failOnStderr: false

      
      - task: Bash@3
        displayName: Determine signing style and pods update (with verification)
        inputs:
          targetType: 'inline'
          script: |
            SCRIPT_PATH="$(Agent.HomeDirectory)/scripts/determine-signing-style-and-pods-update.sh"
            if [ -f "$SCRIPT_PATH" ]; then
              echo "Running determine-signing-style-and-pods-update.sh..."
              cd $(Build.SourcesDirectory)
              bash "$SCRIPT_PATH"
            else
              echo "determine-signing-style-and-pods-update.sh not found, setting manual signing..."
              echo "##vso[task.setvariable variable=SIGNING_OPTION]manual"
            fi
          failOnStderr: false
      
      - task: PowerShell@2
        displayName: Determine monotonically increasing build number
        inputs: 
          targetType: 'inline'
          script: |
            $maxBundleVersion = 2147483647
            $timestamp = Get-Date -Format "yyyyMMddHH"
            [long]$timestampValue = 0
            if (-not [long]::TryParse($timestamp, [ref]$timestampValue)) {
              throw "Unable to parse timestamp '$timestamp' into a numeric build number"
            }
            $increment = 1
            $buildIdRaw = $env:BUILD_BUILDID

            if (![string]::IsNullOrWhiteSpace($buildIdRaw)) {
              [long]$buildId = 0
              if ([long]::TryParse($buildIdRaw, [ref]$buildId) -and $buildId -gt 0) {
                $increment = (($buildId - 1) % 1000) + 1
              } else {
                Write-Warning "BUILD_BUILDID value '$buildIdRaw' is invalid. Falling back to timestamp-based increment."
              }
            } else {
              Write-Warning "BUILD_BUILDID is not available. Falling back to timestamp-based increment."
            }

            $versionCode = $timestampValue + $increment

            if ($versionCode -gt $maxBundleVersion) {
              throw "Calculated bundle version '$versionCode' exceeds the App Store Connect limit '$maxBundleVersion'"
            }
            Write-Host "Calculated bundle version: $versionCode"
            Write-Host "##vso[task.setvariable variable=versionCode]$versionCode"
            Write-Host "##vso[task.setvariable variable=BUNDLE_VERSION]$versionCode"
      
      - task: CmdLine@1
        displayName: Set Bundle version
        inputs:
          filename: /usr/bin/find
          arguments: >-
            . -name "*Info.plist" -exec /usr/libexec/PlistBuddy -c "Set
            :CFBundleVersion $(versionCode)" {} ;
      
      - task: Bash@3
        displayName: Create exportOptions.plist
        inputs:
          targetType: 'inline'
          script: |
            cat > $(Build.SourcesDirectory)/exportOptions.plist << 'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>B4T44MT553</string>
              <key>uploadSymbols</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                <key>com.etendoapploader.ios</key>
                <string>26b648c5-9580-43c7-8056-0fffdaf5585d</string>
                <key>com.etendoapploader.ios.EtendoRecieveShare</key>
                <string>080f18d3-512f-4055-995c-8a8a89aa52ec</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
            </dict>
            </plist>
            EOF

      - task: Bash@3
        displayName: Xcode archive (signed)
        inputs:
          targetType: 'inline'
          script: |
            set -euo pipefail
            export DEVELOPER_DIR="$(xcode-select -p)"
            XCODEBUILD="$DEVELOPER_DIR/usr/bin/xcodebuild"
            echo "Using Xcode at: $DEVELOPER_DIR"
            echo "xcodebuild: $XCODEBUILD"
            "$XCODEBUILD" -version

            # Ensure iOS platform is registered for THIS Xcode
            echo "=== Ensuring iOS platform is available ==="
            "$XCODEBUILD" -downloadPlatform iOS 2>&1 || true
            "$XCODEBUILD" -showsdks | grep -i iphoneos || true

            ARCHIVE_PATH="$(agent.builddirectory)/output/build/archive/Etendo_Mobile.xcarchive"
            EXPORT_PATH="$(agent.builddirectory)/output/build/export"

            echo "=== Archiving ==="
            "$XCODEBUILD" archive \
              -workspace ios/Etendo_Mobile.xcworkspace \
              -scheme Etendo_Mobile \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              -allowProvisioningUpdates \
              -parallelizeTargets -jobs 4 \
              CODE_SIGN_STYLE=Manual \
              "CODE_SIGN_IDENTITY=$(APPLE_CERTIFICATE_SIGNING_IDENTITY)" \
              PROVISIONING_PROFILE=26b648c5-9580-43c7-8056-0fffdaf5585d \
              DEVELOPMENT_TEAM=B4T44MT553

            echo "=== Exporting IPA ==="
            "$XCODEBUILD" -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist "$(Build.SourcesDirectory)/exportOptions.plist" \
              -allowProvisioningUpdates
          workingDirectory: '$(Build.SourcesDirectory)'
        timeoutInMinutes: 180
      
      - task: CopyFiles@2
        displayName: Copy build files to staging
        inputs:
          SourceFolder: $(agent.builddirectory)/output/build/export
          Contents: '**/*.ipa'
          TargetFolder: $(build.artifactstagingdirectory)/build
          OverWrite: true
          flattenFolders: true
      
      - task: CopyFiles@2
        displayName: Copy symbol files to staging
        inputs:
          SourceFolder: >-
            $(agent.builddirectory)/output/build/archive/Etendo_Mobile.xcarchive/dSYMs
          Contents: '**/*.dSYM/**'
          TargetFolder: $(build.artifactstagingdirectory)/symbols
          OverWrite: true
      
      - task: PublishBuildArtifacts@1
        displayName: Publish build
        inputs:
          PathtoPublish: $(build.artifactstagingdirectory)/build
          ArtifactName: build
          TargetPath: \\my\share\$(Build.DefinitionName)\$(Build.BuildNumber)
      
      - task: PublishBuildArtifacts@1
        displayName: Publish symbols
        continueOnError: true
        inputs:
          PathtoPublish: $(build.artifactstagingdirectory)/symbols
          ArtifactName: symbols
          TargetPath: \\my\share\$(Build.DefinitionName)\$(Build.BuildNumber)
      
      - script: |
          echo "New version with updated features and compatibility improvements" > $(System.DefaultWorkingDirectory)/ReleaseNotes.txt
          echo "Please test compatibility with iOS 15+ and report any issues" > $(System.DefaultWorkingDirectory)/changelog.txt
        displayName: 'Create Release Notes and Changelog files'
      
      - task: AppStoreRelease@1
        inputs:
          serviceEndpoint: 'app center'
          releaseTrack: 'TestFlight'
          ipaPath: '$(build.artifactstagingdirectory)/build/*.ipa'
          appIdentifier: 'com.etendoapploader.ios'
          appType: 'iOS'
          appSpecificId: '6451114033'
          distributedToExternalTesters: true
          releaseNotes: '$(System.DefaultWorkingDirectory)/ReleaseNotes.txt'
          changelog: '$(System.DefaultWorkingDirectory)/changelog.txt'
          externalTestersGroups: 'external tester'
        displayName: 'Publish to TestFlight'
